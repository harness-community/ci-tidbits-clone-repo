# GitHub connector — clone this tidbit repo over HTTPS.
# The PAT lives in a Harness secret. This file only stores the secret id.
#
# Create the Text Secret first:
#   id: github-pat
#   value: a GitHub PAT (or fine-grained token). Optional for a public
#   repo (it avoids anonymous rate limits). Required once the repo is private.
#
# Then: Project Settings → Connectors → GitHub → paste this YAML.
# Account scope (url: https://github.com) so the same connector can clone
# any repo the token can read. The pipeline supplies repoName at runtime.
# executeOnDelegate: false is required for Harness Cloud build infrastructure.

connector:
  name: github-connector
  identifier: githubconnector
  description: HTTPS GitHub connector used to clone application code
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  type: Github
  spec:
    url: https://github.com
    type: Account
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          # REPLACE: GitHub username that owns the PAT
          username: <YOUR_GITHUB_USER>
          tokenRef: github-pat
    apiAccess:
      type: Token
      spec:
        tokenRef: github-pat
    executeOnDelegate: false
    proxy: false
    ignoreTestConnection: false
